[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mug-neurotune"
version = "0.2.0"
description = "Validated maturation / dopaminergic-fidelity / stress scorecard for human midbrain organoids, with a spaceflight (LEO vs ground) module and an organoid oxygen-transport model."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
mugnt = "mug_neurotune.cli:main"

[tool.setuptools]
packages = ["mug_neurotune", "o2model"]

[tool.setuptools.package-data]
mug_neurotune = ["data/*.json"]
